name: Android Build
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Build APK
      run: bash ./gradlew assembleDebug --stacktrace || true
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: My-Athkari-App
        path: "**/build/outputs/apk/debug/*.apk"
